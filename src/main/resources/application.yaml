# Django의 settings.py와 같은 역할을 하는 파일입니다.
spring:
  application:
    name: springsession
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/likelion_blog}
    username: ${DB_USERNAME:likelion}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-validity: 1800000        # 30분  (밀리초)
  refresh-token-validity: 1209600000    # 14일  (Part 6에서 씁니다)